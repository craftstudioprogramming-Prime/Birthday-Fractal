<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #dcebd8;
    font-family: Arial, Helvetica, sans-serif;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #ffffff 0%,
            #eef6eb 35%,
            #c8ddc4 100%
        );
}

/* Свет в центре */

.scene::before {
    content: "";
    position: absolute;

    width: 600px;
    height: 600px;

    border-radius: 50%;

    background: white;

    filter: blur(110px);
    opacity: .55;
}

/* ЦЕНТР */

.center {
    position: relative;
    z-index: 10;

    text-align: center;

    animation: entrance 1.3s cubic-bezier(.16,1,.3,1);
}

/* Маленькая надпись */

.top {
    margin-bottom: 25px;

    color: #66806a;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 6px;

    text-transform: uppercase;

    animation: fade .9s ease;
}

/* ГЛАВНОЕ ПОЗДРАВЛЕНИЕ */

.title {
    display: flex;
    flex-direction: column;

    gap: 5px;

    font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

    font-weight: 900;

    font-size: clamp(48px, 8vw, 110px);

    line-height: .9;

    letter-spacing: -3px;

    color: #304c35;

    text-shadow:
        5px 5px 0 #a9c7a5,
        10px 14px 30px rgba(45,75,50,.18);

    transform: skew(-4deg);
}

/* Разные наклоны строк */

.title .line1 {
    transform: rotate(-2deg);
}

.title .line2 {
    transform: rotate(2deg);
}

/* Нижняя подпись */

.bottom {
    margin-top: 30px;

    color: #607a64;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 4px;

    animation: fade 1s ease .8s both;
}

/* ПОДАРКИ */

.gift {
    position: absolute;

    z-index: 5;

    font-size: 65px;

    filter:
        drop-shadow(0 12px 12px rgba(40,70,40,.18));

    animation: float 4s ease-in-out infinite;
}

.gift1 {
    left: 7%;
    bottom: 10%;
    transform: rotate(-12deg);
}

.gift2 {
    right: 7%;
    bottom: 11%;
    transform: rotate(12deg);
    animation-delay: 1s;
}

.gift3 {
    left: 10%;
    top: 12%;

    font-size: 45px;

    animation-delay: 1.5s;
}

.gift4 {
    right: 10%;
    top: 13%;

    font-size: 48px;

    animation-delay: 2s;
}

/* ХЛОПУШКИ */

.party {
    position: absolute;

    z-index: 6;

    font-size: 60px;

    animation: party 3s ease-in-out infinite;
}

.party1 {
    left: 3%;
    top: 45%;
    transform: rotate(-25deg);
}

.party2 {
    right: 3%;
    top: 44%;
    transform: rotate(25deg);

    animation-delay: 1s;
}

/* ЗВЁЗДЫ */

.star {
    position: absolute;

    color: #6f906f;

    font-size: 25px;

    animation: sparkle 2.5s ease-in-out infinite;
}

.s1 {
    left: 22%;
    top: 20%;
}

.s2 {
    right: 22%;
    top: 23%;

    animation-delay: .7s;
}

.s3 {
    left: 22%;
    bottom: 21%;

    animation-delay: 1.4s;
}

.s4 {
    right: 22%;
    bottom: 20%;

    animation-delay: 2s;
}

/* КОНФЕТТИ */

.confetti {
    position: absolute;

    top: -25px;

    width: 7px;
    height: 16px;

    border-radius: 2px;

    animation: fall linear infinite;
}

/* АНИМАЦИИ */

@keyframes entrance {
    from {
        opacity: 0;
        transform: scale(.7);
        filter: blur(15px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-10deg);
    }

    50% {
        transform: translateY(-18px) rotate(-4deg);
    }
}

@keyframes party {
    0%, 100% {
        transform: translateY(0) rotate(-20deg);
    }

    50% {
        transform: translateY(-15px) rotate(-8deg);
    }
}

@keyframes sparkle {
    0%, 100% {
        opacity: .25;
        transform: scale(.7) rotate(0);
    }

    50% {
        opacity: 1;
        transform: scale(1.5) rotate(180deg);
    }
}

@keyframes fall {
    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* ТЕЛЕФОН */

@media (max-width: 600px) {

    .title {
        font-size: 50px;
        letter-spacing: -2px;
    }

    .gift {
        font-size: 42px;
    }

    .party {
        font-size: 40px;
    }

    .top {
        font-size: 9px;
        letter-spacing: 4px;
    }

    .bottom {
        font-size: 10px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- ПОДАРКИ -->

    <div class="gift gift1">🎁</div>
    <div class="gift gift2">🎁</div>
    <div class="gift gift3">🎁</div>
    <div class="gift gift4">🎁</div>

    <!-- ХЛОПУШКИ -->

    <div class="party party1">🎉</div>
    <div class="party party2">🎊</div>

    <!-- ЗВЁЗДЫ -->

    <div class="star s1">✦</div>
    <div class="star s2">✧</div>
    <div class="star s3">✦</div>
    <div class="star s4">✧</div>

    <!-- ГЛАВНЫЙ ТЕКСТ -->

    <div class="center">

        <div class="top">
            TODAY IS YOUR DAY
        </div>

        <div class="title">

            <div class="line1">
                С ДНЁМ
            </div>

            <div class="line2">
                РОЖДЕНИЯ!
            </div>

        </div>

        <div class="bottom">
            🎂 СЧАСТЬЯ • РАДОСТИ • УДАЧИ 🎂
        </div>

    </div>

    <!-- КОНФЕТТИ -->

    <div id="confetti"></div>

</div>

<script>

const container =
    document.getElementById("confetti");

const colors = [
    "#304c35",
    "#57705b",
    "#8aaa8b",
    "#d4b85a",
    "#ffffff"
];

for (let i = 0; i < 100; i++) {

    const piece =
        document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
        Math.random() * 100 + "vw";

    piece.style.background =
        colors[
            Math.floor(
                Math.random() * colors.length
            )
        ];

    piece.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    piece.style.animationDelay =
        Math.random() * 5 + "s";

    container.appendChild(piece);
}

</script>

</body>
</html>
