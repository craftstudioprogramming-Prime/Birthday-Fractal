<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>С Днём Рождения!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    background: #111;
}

/* ФОТО НА ФОНЕ */

.scene::before {
    content: "";
    position: absolute;
    inset: -25px;

    background-image:
        linear-gradient(
            rgba(0, 25, 35, .25),
            rgba(0, 25, 35, .35)
        ),
        url("background.png");

    background-size: cover;
    background-position: center;

    filter: blur(8px);

    transform: scale(1.04);

    z-index: 0;
}

/* ЛЁГКОЕ СВЕЧЕНИЕ */

.scene::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.18),
            transparent 45%
        );

    z-index: 1;
}

/* ЦЕНТР */

.content {
    position: relative;
    z-index: 5;

    text-align: center;

    color: white;

    animation: show 1.2s ease;
}

/* маленькая надпись */

.small {
    font-size: 13px;
    letter-spacing: 5px;

    opacity: .85;

    margin-bottom: 20px;

    text-transform: uppercase;
}

/* ГЛАВНАЯ НАДПИСЬ */

h1 {
    font-size: clamp(52px, 9vw, 110px);

    font-weight: 700;

    line-height: .95;

    letter-spacing: -2px;

    text-shadow:
        0 3px 15px rgba(0,0,0,.45),
        0 0 25px rgba(50,240,255,.35);
}

h1 span {
    color: #8fffff;
}

/* ЛИНИЯ */

.line {
    width: 90px;
    height: 3px;

    background: #7ff7ff;

    margin: 25px auto;

    border-radius: 10px;

    box-shadow:
        0 0 15px #7ff7ff;
}

/* НИЖНИЙ ТЕКСТ */

.message {
    font-size: 15px;

    letter-spacing: 2px;

    opacity: .9;

    text-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

/* ЗВЁЗДЫ */

.star {
    position: absolute;

    z-index: 4;

    color: white;

    font-size: 20px;

    text-shadow:
        0 0 12px #65f7ff;

    animation: sparkle 2s infinite;
}

.star1 {
    left: 15%;
    top: 20%;
}

.star2 {
    right: 15%;
    top: 25%;

    animation-delay: .7s;
}

.star3 {
    left: 20%;
    bottom: 20%;

    animation-delay: 1.2s;
}

.star4 {
    right: 20%;
    bottom: 18%;

    animation-delay: 1.7s;
}

/* КОНФЕТТИ */

.confetti {
    position: absolute;

    top: -20px;

    width: 5px;
    height: 12px;

    z-index: 3;

    border-radius: 2px;

    animation: fall linear infinite;
}

/* АНИМАЦИИ */

@keyframes show {
    from {
        opacity: 0;
        transform: scale(.92);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes sparkle {
    0%,100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

@keyframes fall {
    to {
        transform:
            translateY(110vh)
            rotate(500deg);
    }
}

/* ТЕЛЕФОН */

@media (max-width: 600px) {

    h1 {
        font-size: 52px;
    }

    .small {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .message {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="star star1">✦</div>
    <div class="star star2">✧</div>
    <div class="star star3">✦</div>
    <div class="star star4">✧</div>

    <div class="content">

        <div class="small">
            Для самого лучшего друга
        </div>

        <h1>
            С Днём<br>
            <span>Рождения!</span>
        </h1>

        <div class="line"></div>

        <div class="message">
            Пусть этот день запомнится надолго ✦
        </div>

    </div>

    <div id="confetti"></div>

</div>

<script>

const container =
    document.getElementById("confetti");

const colors = [
    "#ffffff",
    "#7ff7ff",
    "#45e9f5"
];

for (let i = 0; i < 60; i++) {

    const piece =
        document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
        Math.random() * 100 + "vw";

    piece.style.background =
        colors[
            Math.floor(
                Math.random() * colors.length
            )
        ];

    piece.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    piece.style.animationDelay =
        Math.random() * 5 + "s";

    container.appendChild(piece);
}

</script>

</body>
</html>
