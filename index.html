<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>С Днём Рождения</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #07191d;
    color: white;
}


/* =========================
   ФОН
========================= */

.page {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

.page::before {
    content: "";
    position: absolute;
    inset: -30px;

    background:
        url("background.png")
        center / cover
        no-repeat;

    filter: blur(11px);
    transform: scale(1.08);

    opacity: .68;
}

.page::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(0, 20, 25, .72),
            rgba(0, 0, 0, .38)
        );
}


/* =========================
   ЗАСТАВКА
========================= */

.splash {
    position: absolute;
    inset: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.splash.hide {
    opacity: 0;
    visibility: hidden;
}

.splash-content {
    animation: splashIn 1.5s ease;
}

.splash-small {
    margin-bottom: 22px;

    font-size: 12px;
    letter-spacing: 5px;

    color: rgba(255,255,255,.7);

    text-transform: uppercase;
}

.splash-title {
    font-size: clamp(52px, 10vw, 105px);

    line-height: .9;

    font-weight: 900;

    letter-spacing: -5px;

    text-shadow:
        0 10px 40px rgba(0,0,0,.4);
}

.splash-title span {
    color: #69eeee;

    text-shadow:
        0 0 35px rgba(80,240,240,.5);
}

@keyframes splashIn {

    from {
        opacity: 0;
        transform:
            scale(.9)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================
   ОСНОВНОЙ ЭКРАН
========================= */

.main {
    position: absolute;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.main.show {
    opacity: 1;
    visibility: visible;
}


/* =========================
   ТЕКСТ
========================= */

.greeting {
    width: min(
        780px,
        calc(100% - 35px)
    );

    text-align: center;

    opacity: 0;

    transform:
        translateY(20px)
        scale(.96);

    pointer-events: none;
}

.main.party .greeting {
    pointer-events: auto;

    animation:
        greetingAppear 1.2s ease forwards,
        gentleMove 4s ease-in-out 1.2s infinite;
}

@keyframes greetingAppear {

    from {
        opacity: 0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes gentleMove {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    25% {
        transform:
            translateY(-2px)
            rotate(.25deg);
    }

    50% {
        transform:
            translateY(1px)
            rotate(-.25deg);
    }

    75% {
        transform:
            translateY(-1px)
            rotate(.2deg);
    }
}


/* маленький текст */

.small-text {
    margin-bottom: 18px;

    font-size: 12px;
    letter-spacing: 4px;

    color: rgba(255,255,255,.65);

    text-transform: uppercase;
}


/* заголовок */

.title {
    font-size: clamp(
        48px,
        8vw,
        88px
    );

    line-height: .92;

    font-weight: 900;

    letter-spacing: -4px;

    text-shadow:
        0 12px 45px rgba(0,0,0,.4);
}

.title span {
    color: #69eeee;

    text-shadow:
        0 0 35px rgba(80,240,240,.5);
}


/* линия */

.line {
    width: 65px;
    height: 2px;

    margin: 28px auto;

    background: #69eeee;

    box-shadow:
        0 0 20px rgba(80,240,240,.6);
}


/* пожелание */

.wish {
    max-width: 650px;

    margin: auto;

    color: rgba(255,255,255,.88);

    font-size: clamp(
        15px,
        2vw,
        19px
    );

    line-height: 1.6;

    text-shadow:
        0 5px 20px rgba(0,0,0,.35);
}

.wish strong {
    color: white;
}


/* =========================
   КНОПКА
========================= */

.magic-button {
    position: absolute;

    left: 50%;
    bottom: 28px;

    transform: translateX(-50%);

    z-index: 30;

    padding: 8px 12px;

    border: none;

    background: transparent;

    color: rgba(255,255,255,.3);

    font-size: 10px;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .4s ease;
}

.magic-button:hover {
    color: rgba(255,255,255,.7);
}

.magic-button.active {
    color: rgba(105,238,238,.7);
}


/* =========================
   ОТ ДАВИДА
========================= */

.author {
    position: absolute;

    right: 28px;
    bottom: 25px;

    color: rgba(255,255,255,.32);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 1;

    transition: .5s ease;
}


/* =========================
   ЗВЁЗДЫ
========================= */

.stars {
    position: absolute;
    inset: 0;

    z-index: 5;

    pointer-events: none;
}

.star {
    position: absolute;

    opacity: 0;

    color: white;

    font-size: 14px;

    text-shadow:
        0 0 12px white,
        0 0 25px #69eeee;
}


/* позиции */

.star:nth-child(1) {
    left: 12%;
    top: 20%;
    animation-delay: .1s;
}

.star:nth-child(2) {
    left: 25%;
    top: 70%;
    animation-delay: 1.2s;
}

.star:nth-child(3) {
    left: 78%;
    top: 20%;
    animation-delay: 2s;
}

.star:nth-child(4) {
    left: 87%;
    top: 65%;
    animation-delay: .7s;
}

.star:nth-child(5) {
    left: 68%;
    top: 42%;
    animation-delay: 1.6s;
}

.star:nth-child(6) {
    left: 17%;
    top: 45%;
    animation-delay: 2.5s;
}

.star:nth-child(7) {
    left: 53%;
    top: 15%;
    animation-delay: .5s;
}

.star:nth-child(8) {
    left: 45%;
    top: 82%;
    animation-delay: 1.8s;
}


/* звёзды включаются только после кнопки */

.stars.active .star {
    animation:
        starAnimation 3s ease-in-out infinite;
}

@keyframes starAnimation {

    0% {
        opacity: 0;

        transform:
            scale(.2)
            rotate(0);
    }

    35% {
        opacity: 1;

        transform:
            scale(1.3)
            rotate(45deg);
    }

    65% {
        opacity: .65;

        transform:
            scale(.9)
            rotate(90deg);
    }

    100% {
        opacity: 0;

        transform:
            scale(.2)
            rotate(135deg);
    }
}


/* =========================
   ЧАСТИЦЫ
========================= */

.particle {
    position: absolute;

    z-index: 4;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #69eeee;

    box-shadow:
        0 0 12px #69eeee;

    pointer-events: none;

    animation:
        particleAnimation 4s
        ease-in-out infinite;
}

@keyframes particleAnimation {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.4);
    }

    30% {
        opacity: .8;
    }

    70% {
        opacity: .5;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-50px)
            scale(1);
    }
}


/* =========================
   МОБИЛЬНЫЕ
========================= */

@media (max-width: 600px) {

    .splash-small {
        font-size: 9px;
        letter-spacing: 3px;
        margin-bottom: 18px;
    }

    .splash-title {
        font-size: 55px;
        letter-spacing: -3px;
    }

    .small-text {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .title {
        font-size: 54px;
        letter-spacing: -3px;
    }

    .line {
        margin: 22px auto;
    }

    .wish {
        padding: 0 10px;

        font-size: 15px;

        line-height: 1.55;
    }

    .magic-button {
        bottom: 20px;
    }

    .author {
        right: 18px;
        bottom: 18px;

        font-size: 8px;
        letter-spacing: 2px;
    }
}
</style>
</head>


<body>

<div class="page">


    <!-- =====================
         ЗАСТАВКА
    ====================== -->

    <div class="splash" id="splash">

        <div class="splash-content">

            <div class="splash-small">
                Для самого лучшего друга
            </div>

            <div class="splash-title">
                С Днём<br>
                <span>Рождения!</span>
            </div>

        </div>

    </div>


    <!-- =====================
         ЗВЁЗДЫ
    ====================== -->

    <div class="stars" id="stars">

        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>

    </div>


    <!-- =====================
         ОСНОВНОЙ ЭКРАН
    ====================== -->

    <main class="main" id="main">


        <div class="greeting">

            <div class="small-text">
                Сегодня твой день ✦
            </div>


            <div class="title">
                С Днём<br>
                <span>Рождения!</span>
            </div>


            <div class="line"></div>


            <div class="wish">

                Желаю тебе, чтобы
                <strong>твои идеи</strong>
                превращались в крутые проекты,
                всё задуманное получалось,
                а впереди было ещё много
                вдохновения, новых идей
                и крутых достижений. ✦

            </div>

        </div>


        <!-- кнопка -->

        <button
            class="magic-button"
            id="magicButton"
            onclick="startMagic()"
        >
            нажми ✦
        </button>


        <!-- подпись -->

        <div class="author">
            От Давида
        </div>


    </main>

</div>


<script>

/* =========================
   ЧЕРЕЗ 5 СЕКУНД УБИРАЕМ
   ЗАСТАВКУ
========================= */

setTimeout(() => {

    document
        .getElementById("splash")
        .classList.add("hide");

    document
        .getElementById("main")
        .classList.add("show");

}, 5000);


/* =========================
   КНОПКА
========================= */

function startMagic() {

    const main =
        document.getElementById("main");

    const button =
        document.getElementById("magicButton");

    const stars =
        document.getElementById("stars");


    /* показываем поздравление */

    main.classList.add("party");


    /* включаем звёзды */

    stars.classList.add("active");


    /* кнопка */

    button.classList.add("active");

    button.textContent = "✦ ✦ ✦";


    setTimeout(() => {

        button.textContent = "ещё раз ✦";

    }, 1500);


    /* частицы */

    createParticles();

}


/* =========================
   ЧАСТИЦЫ
========================= */

function createParticles() {

    const page =
        document.querySelector(".page");


    for (let i = 0; i < 28; i++) {

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.top =
            15 + Math.random() * 75 + "%";


        particle.style.animationDelay =
            Math.random() * 2 + "s";


        particle.style.animationDuration =
            3 + Math.random() * 3 + "s";


        page.appendChild(particle);


        setTimeout(() => {

            particle.remove();

        }, 7000);

    }

}

</script>

</body>
</html>
